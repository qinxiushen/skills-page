  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0a0e27;
      color: #c8d3f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,126,234,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,126,234,0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      top: -120px;
      right: -120px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99,126,234,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .glow-orb {
      position: fixed;
      bottom: -100px;
      left: -100px;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(118,75,162,0.2) 0%, transparent 70%);
      pointer-events: none;
    }
    .card {
      background: rgba(16, 21, 51, 0.85);
      border: 1px solid rgba(99,126,234,0.25);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(20px);
      position: relative;
      z-index: 1;
      box-shadow:
        0 0 40px rgba(99,126,234,0.1),
        0 20px 60px rgba(0,0,0,0.4);
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin: 0 auto 20px;
      overflow: hidden;
      border: 2px solid rgba(99,126,234,0.5);
      box-shadow: 0 0 24px rgba(99,126,234,0.3);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; background: linear-gradient(90deg, #a5b4fc, #e0e7ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .bio { font-size: 14px; color: rgba(165,180,252,0.6); margin-bottom: 28px; line-height: 1.6; }
    .section-title { font-size: 12px; font-weight: 600; color: rgba(99,126,234,0.8); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 14px; }
    .skills { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 28px; }
    .skill-tag { background: rgba(99,126,234,0.1); color: #a5b4fc; padding: 6px 16px; border-radius: 20px; font-size: 13px; text-decoration: none; display: inline-block; cursor: pointer; border: 1px solid rgba(99,126,234,0.3); transition: all 0.25s ease; }
    .skill-tag:hover { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border-color: transparent; box-shadow: 0 0 20px rgba(102,126,234,0.5); transform: translateY(-2px); }
    .links { display: flex; flex-direction: column; gap: 10px; }
    .link-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 0; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.25s ease; border: none; cursor: pointer; width: 100%; position: relative; overflow: hidden; }
    .link-btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); transform: translateX(-100%); transition: transform 0.5s; }
    .link-btn:hover::before { transform: translateX(100%); }

    .link-btn.wechat { background: linear-gradient(135deg, #16a34a, #4ade80); color: #fff; box-shadow: 0 4px 15px rgba(22,163,74,0.3); }

    .icon { font-size: 18px; }
    /* 流星 */
    .meteors { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .meteor { position: absolute; height: 2px; background: linear-gradient(90deg, transparent, rgba(99,126,234,0.3), rgba(165,180,252,0.9)); border-radius: 50%; filter: blur(0.3px); animation: meteorFly linear infinite; opacity: 0; right: -20px; box-shadow: 0 0 6px rgba(165,180,252,0.4); }
    @keyframes meteorFly { 0% { transform: translateX(0) translateY(0); opacity: 0; } 8% { opacity: 1; } 75% { opacity: 0.8; } 100% { transform: translateX(-110vw) translateY(350px); opacity: 0; } }
    /* 粒子 */
    .particle { position: fixed; pointer-events: none; border-radius: 50%; background: radial-gradient(circle, rgba(165,180,252,0.9), rgba(99,126,234,0.3), transparent); z-index: 0; animation: particleFade 0.8s ease-out forwards; }
    @keyframes particleFade { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0); } }
    /* 音乐播放器 */
    .music-panel {
      position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; align-items: center; gap: 8px;

    .music-panel .music-btn {
      position: relative; width: 44px; height: 44px; border-radius: 50%;

    .music-panel .music-btn:hover { background: rgba(99,126,234,0.4); transform: scale(1.08); }
    .music-panel .music-btn svg { width: 18px; height: 18px; fill: #a5b4fc; }
    .music-panel .music-btn.playing { animation: musicPulse 2s ease-in-out infinite; }
    @keyframes musicPulse { 0%, 100% { box-shadow: 0 4px 20px rgba(99,126,234,0.25); } 50% { box-shadow: 0 4px 32px rgba(99,126,234,0.5); } }
    .music-panel .mute-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(99,126,234,0.15); border: 1px solid rgba(99,126,234,0.3);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.25s;
    }
    .music-panel .mute-btn:hover { background: rgba(99,126,234,0.3); }
    .music-panel .mute-btn svg { width: 16px; height: 16px; fill: #a5b4fc; }
    .music-panel .mute-btn.muted svg { fill: #f87171; }
    .music-panel .volume-slider {
      -webkit-appearance: none; appearance: none; width: 80px; height: 4px;
      border-radius: 2px; background: rgba(99,126,234,0.3); outline: none; cursor: pointer;
    }
    .music-panel .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: #a5b4fc; cursor: pointer; box-shadow: 0 2px 6px rgba(99,126,234,0.4);
    }
    .music-panel .volume-slider::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%; background: #a5b4fc;

    .music-panel .song-info {

    .music-panel .prev-btn, .music-panel .next-btn {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(99,126,234,0.12); border: 1px solid rgba(99,126,234,0.25);
      cursor: pointer; display: flex; align-items: center; justify-content: center;

    }
    .music-panel .prev-btn:hover, .music-panel .next-btn:hover { background: rgba(99,126,234,0.3); }
    .music-panel .prev-btn svg, .music-panel .next-btn svg { width: 14px; height: 14px; fill: #a5b4fc; }
    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: rgba(16,21,51,0.95); border: 1px solid rgba(99,126,234,0.3); border-radius: 20px; padding: 32px 28px; max-width: 340px; width: 100%; text-align: center; backdrop-filter: blur(20px); animation: pop 0.25s ease; box-shadow: 0 0 60px rgba(99,126,234,0.15); }
    @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal h3 { font-size: 18px; margin-bottom: 20px; color: #e0e7ff; }
    .modal img { width: 100%; max-width: 240px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(99,126,234,0.2); }
    .modal-close { background: rgba(99,126,234,0.15); border: 1px solid rgba(99,126,234,0.3); color: #a5b4fc; padding: 9px 28px; border-radius: 10px; font-size: 14px; cursor: pointer; }
    .modal-close:hover { background: rgba(99,126,234,0.3); }
  </style>

  <script>
    // ====== 模态框 ======
    function openModal(id) { document.getElementById('modal-' + id).classList.add('active'); }
    function closeModal(e, id) { document.getElementById('modal-' + id).classList.remove('active'); }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
    });

    // ====== 鼠标粒子 ======
    let particleTimer = null;
    document.addEventListener('mousemove', function(e) {
      if (particleTimer) return;
      particleTimer = setTimeout(() => {
        particleTimer = null;
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 6 + 3;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = (e.clientX - size / 2) + 'px';
        p.style.top = (e.clientY - size / 2) + 'px';
        document.body.appendChild(p);
        setTimeout(() => { if (p.parentNode) p.parentNode.removeChild(p); }, 800);
      }, 30);
    });

    // ====== 背景音乐（真实音频，自动播放）======
    const playlist = [
      { title: "宁静森林", url: "https://cdn.pixabay.com/audio/2022/03/15/audio_8cb749d484.mp3" },
      { title: "晨间冥想", url: "https://cdn.pixabay.com/audio/2022/10/25/audio_946bc3cd76.mp3" },
      { title: "海浪轻拍", url: "https://cdn.pixabay.com/audio/2022/08/02/audio_884fe92c21.mp3" },
      { title: "雨后清新", url: "https://cdn.pixabay.com/audio/2024/02/07/audio_27ae61fa78.mp3" },
      { title: "心灵之旅", url: "https://cdn.pixabay.com/audio/2023/09/06/audio_de25aec4e0.mp3" }
    ];
    
    let audio = new Audio();
    let currentIndex = 0;
    let isPlaying = false;
    let isMuted = false;
    let defaultVolume = 0.1;
    
    const playBtn = document.getElementById('musicBtn');
    const playIcon = document.getElementById('playIcon');
    const muteBtn = document.getElementById('muteBtn');
    const volumeIcon = document.getElementById('volumeIcon');
    const volumeSlider = document.getElementById('volumeSlider');
    const songInfo = document.getElementById('songInfo');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    
    function loadTrack(index) {
      currentIndex = index % playlist.length;
      if (currentIndex < 0) currentIndex = playlist.length - 1;
      audio.src = playlist[currentIndex].title ? playlist[currentIndex].url : '';
      songInfo.textContent = playlist[currentIndex].title;
    }
    
    function playMusic() {
      if (!audio.src) loadTrack(currentIndex);
      audio.play().then(() => {
        isPlaying = true;
        playBtn.classList.add('playing');
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      }).catch(err => {
        console.log('播放需要用户交互');
      });
    }
    
    function pauseMusic() {
      audio.pause();
      isPlaying = false;
      playBtn.classList.remove('playing');
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
    
    function togglePlay() {
      if (isPlaying) pauseMusic(); else playMusic();
    }
    
    function toggleMute() {
      isMuted = !isMuted;
      audio.muted = isMuted;
      muteBtn.classList.toggle('muted', isMuted);
      volumeIcon.innerHTML = isMuted 
        ? '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
        : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
    }
    
    function setVolume(val) {
      audio.volume = val / 100;
      if (val > 0 && isMuted) toggleMute();
    }
    
    function prevTrack() {
      loadTrack(currentIndex - 1);
      if (isPlaying) playMusic();
    }
    
    function nextTrack() {
      loadTrack(currentIndex + 1);
      if (isPlaying) playMusic();
    }
    
    // 事件绑定
    playBtn.addEventListener('click', togglePlay);
    muteBtn.addEventListener('click', toggleMute);
    volumeSlider.addEventListener('input', (e) => setVolume(e.target.value));
    prevBtn.addEventListener('click', prevTrack);
    nextBtn.addEventListener('click', nextTrack);
    
    audio.addEventListener('ended', () => nextTrack());
    audio.addEventListener('error', () => {
      console.log('音乐加载失败，尝试下一首');
      nextTrack();
    });
    
    // 初始化音量
    audio.volume = defaultVolume;
    volumeSlider.value = defaultVolume * 100;
    
    // 默认自动播放（500ms延迟绕过浏览器拦截）
    setTimeout(() => {
      loadTrack(0);
      playMusic();
    }, 500);
  </script>
</body>
</html>
