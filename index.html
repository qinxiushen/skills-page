<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技能主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: rgba(255,255,255,0.95);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    h1 { font-size: 28px; color: #1e1e2e; margin-bottom: 8px; }
    .subtitle { color: #64748b; font-size: 14px; margin-bottom: 36px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: #f8fafc;
      border-radius: 12px;
      text-decoration: none;
      color: #334155;
      font-size: 15px;
      transition: all 0.2s;
      border: 1px solid #e2e8f0;
    }
    a:hover {
      background: #6366f1;
      color: #fff;
      border-color: #6366f1;
      transform: translateX(4px);
    }
    .icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  </style>
</head>
